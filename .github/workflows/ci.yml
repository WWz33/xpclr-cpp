name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libdeflate-dev
      - name: build
        run: make -j2
      - name: test
        run: make test
